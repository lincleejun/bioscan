# bioscan standards: the targets `bioscan bench scorecard` reports against.
# Human-readable version with reasons, current status and release stages: docs/standards.md.
#
# One [[standard]] per bar. Fields:
#   id         <dimension>.<tier>.<scope>.<metric>[.<variant>] for report metrics;
#              <dimension>.<name> for manual entries. Unique.
#   dimension  accuracy | trust | detection | location | directory | speed | coverage |
#              robustness | onboarding | privacy | reproducibility (= the id's first segment)
#   title      one line
#   scope      all | bird | mammal | other   (the report row the metric is read from)
#   metric     a report key (n, gate_acc, detect_rate, top1, top5, genus_acc, coverage, precision,
#              confident_error_rate, no_box_rate, failed_rate, ece, decode_ms_median,
#              identify_ms_median, images_per_s) or "manual" (checked by hand, see docs/standards.md)
#   op         ">=" (higher is better) or "<=" (lower is better)
#   industry   what leaders achieve or claim; the key is OMITTED when there is no comparable number
#              (TOML has no null: a missing `industry` or `stretch` means null)
#   community  the bar for the v0.x community call ("try it and help identify")
#   stretch    the bar we would call leading; omitted when there is none
#   unit       fraction (rates 0-1) | ms | images/s | images | species | formats | minutes | requests | bool
#   how        tier and command that measures it
#   source     where the industry number comes from (URL), or why there is none
#
# Tiers (id's second segment): smoke = CI 77 iNat photos on reduced lists; golden = 1,625 iNat California
# photos (+ an "other animals" slice still to be built); own = the owner's RAW set; public = the future
# multi-region CC0/CC-BY set; mac = speed on Apple Silicon. Variant "nogeo" = a run with --no-geo.
# A bar is met when the Wilson 95% bound clears it (lower bound for ">=", upper for "<="); smoke-tier
# bars are regression guards judged on the point value. See docs/standards.md "Statistical rule".

# ---------------------------------------------------------------- accuracy (golden tier, with GPS)

[[standard]]
id = "accuracy.golden.bird.top1"
dimension = "accuracy"
title = "Birds: top-1 species correct"
scope = "bird"
metric = "top1"
op = ">="
industry = 0.95
community = 0.90
stretch = 0.95
unit = "fraction"
how = "golden: bioscan bench run data/inat/groundtruth-inat.csv --out runs/<tag>-golden (Mac); row bird"
source = "Merlin photo ID average 95% (vendor claim, no test set published): https://ebird.org/news/new-photo-id-model-in-merlin ; academic closed-set SOTA ~92% (TransFG CUB 91.7%, NABirds 90.8%): https://arxiv.org/abs/2103.07976"

