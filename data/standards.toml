# ---------------------------------------------------------------- culling (album profile, synthetic tier)
# Tier `album`, profile `album`: scripts/cull_synth.py degrades the CI smoke photos into labelled
# rejects (subject blur and smear, frame shake, cut-off crops, +-2 EV, shrunk subjects) and bursts;
# tests/models runs them through the album profile and the reducers (models-report-album.json).
# Values come from report.json plugin_metrics[plugin][scope]; judged on the observed value (a
# synthetic regression tier, like smoke). No culling tool publishes reject precision or recall, so
# there is no industry bar; these are ours: losing a keeper costs more than reviewing a reject.

[[standard]]
id = "culling.album.all.keepers_lost"
tier = "album"
profile = "album"
plugin = "quality"
dimension = "culling"
title = "Album: keep-labelled photos a rule rejects"
scope = "all"
metric = "keepers_lost"
op = "<="
community = 0.05
stretch = 0.01
unit = "fraction"
how = "tests/models album smoke (models-report-album.json), or bench run <set>/groundtruth-album.csv --profile album --tier album"
source = "no published figure: Lightroom Assisted Culling and Aftershoot publish none; research doc 2026-09-24-culling-aesthetics.md makes this the budget metric"

[[standard]]
