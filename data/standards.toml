# ---------------------------------------------------------------- geotag from GPX (synthetic tier)
# Tier `geotag`: scripts/geotag_synth.py builds GPX tracks through the golden photos' true positions
# (7 scenarios, seed 7) and `bioscan bench geotag` scores bioscan.geotag against the truth. Scope
# `all` pools the scenarios; errors count photos whose true time is inside the track.

[[standard]]
id = "location.geotag.all.median_error_m"
dimension = "location"
title = "GPX geotag: median position error"
scope = "all"
metric = "median_error_m"
op = "<="
community = 15
stretch = 10
unit = "m"
how = "uv run python scripts/geotag_synth.py data/inat/groundtruth-inat.csv --out runs/geotag-synth --seed 7; bioscan bench geotag runs/geotag-synth; row all"
source = "no published accuracy figure for track-based geotagging found; the synthetic GPS noise (sigma 3-10 m per axis) is the floor"

[[standard]]
id = "location.geotag.all.p90_error_m"
dimension = "location"
