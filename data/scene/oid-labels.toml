# Open Images V7 -> bioscan scene labels: what `bioscan gt scene` samples per label (docs/standards.md,
# "scene tier"; taxonomy in docs/research/2026-09-24-scene-taxonomy.md).
#
# One [label.<name>] per fetched label. `group` is the scene group (today's 8 labels); `scene` is the
# fine label written to the CSV, or "" when Open Images cannot tell (bird portrait vs habitat: the
# group is measured, the fine label is not). Class names are Open Images DisplayNames
# (oidv7-class-descriptions.csv), matched case-insensitively:
#   any  = the image has a human-verified positive label for at least one of these
#   all  = ... for every one of these (an intersection, e.g. Bird and Flight)
#   not  = ... for none of these (a positive there disqualifies)
# An image that qualifies for more than one label is dropped from all of them (an unambiguous set).
# Counts (human-verified positives, val + test, 2026-09-25, docs/research/2026-09-24-scene-datasets.md):
# aurora 16, city_lights 141, moon 174, bird_flight 204 are the short labels; the rest exceed 200.

[label.bird]
group = "wildlife"
scene = ""
any = ["Bird"]
not = ["Flight", "Flock", "Pet", "Person", "Cattle", "Sheep", "Horse"]

[label.bird_flight]
group = "wildlife"
scene = "bird_flight"
all = ["Bird", "Flight"]
not = ["Flock", "Person"]

[label.mammal]
group = "wildlife"
scene = ""
all = ["Mammal", "Wildlife"]
not = ["Person", "Pet", "Cattle", "Sheep", "Horse", "Working animal", "Herd", "Bird"]

[label.other_animal]
group = "wildlife"
scene = "other_animal"
any = ["Reptile", "Amphibian", "Fish"]
not = ["Person", "Bird", "Mammal", "Food", "Underwater", "Coral reef", "Scuba diving"]

[label.herd_flock]
group = "wildlife"
scene = "herd_flock"
any = ["Flock", "Herd"]
not = ["Person"]

[label.domestic]
group = "wildlife"
scene = "domestic"
any = ["Pet", "Cattle", "Sheep", "Horse", "Working animal"]
not = ["Person", "Wildlife", "Herd", "Flock"]

[label.mountain]
group = "landscape"
scene = "mountain"
any = ["Mountain"]
not = ["Animal", "Person", "Building", "Snow", "Glacier", "Lake", "River", "Night", "Bird", "Mammal"]

[label.coast]
