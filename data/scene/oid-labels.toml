# Attributes: written to the CSV's light / setting / framing columns when an image has such a label
# (blank otherwise). No harness metric reads them yet; they cost nothing to keep.
[attribute.light]
night = ["Night"]
golden_hour = ["Sunset", "Sunrise"]
blue_hour = ["Dusk", "Dawn"]

[attribute.setting]
underwater = ["Underwater", "Coral reef", "Scuba diving"]
indoor = ["Room", "Interior design", "Living room", "Kitchen", "Bedroom"]

[attribute.framing]
close_up = ["Macro photography", "Close-up"]
aerial = ["Aerial photography"]
wide = ["Landscape"]
