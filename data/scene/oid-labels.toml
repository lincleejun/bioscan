any = ["Lake", "River", "Waterfall", "Pond", "Stream", "Wetland"]
not = ["Animal", "Person", "Building", "Mountain", "Coast", "Beach", "Night", "Bird", "Mammal", "Boat", "Snow"]

[label.forest]
group = "landscape"
scene = "forest"
any = ["Forest"]
not = ["Animal", "Person", "Building", "Mountain", "Lake", "River", "Snow", "Bird", "Mammal", "Flower", "Fungus", "Mushroom"]

[label.grassland]
