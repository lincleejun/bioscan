[project]
name = "bioscan"
version = "0.1.0"
description = "Animal detection and species identification service for wildlife photos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "torch>=2.6",
    "open-clip-torch>=3.3,<4",
    "transformers>=4.51",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "rawpy==0.27.1",
    "pillow>=11.0",
    "numpy>=2.0",
    "huggingface-hub>=0.30",
    "birdnet>=1.1,<2",
]

[project.scripts]
bioscan-serve = "bioscan.service.app:main"
bioscan = "bioscan.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bioscan"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".worktrees"]

[tool.ruff.lint]
# pyflakes + import order + bugbear; E501 off (lines follow the surrounding code, not a hard limit)
select = ["E4", "E7", "E9", "F", "I", "B"]
# zip() lengths match by construction throughout; strict= would be noise
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# one-off verification scripts kept as run, not maintained code
"scripts/verify/*" = ["E", "B", "I"]
