[project]
name = "bioscan"
version = "0.1.0"
description = "Animal detection and species ID service + thin CLI"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
bioscan = "bioscan.cli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bioscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
