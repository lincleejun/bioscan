[project]
name = "bioscan"
version = "0.1.0"
description = "Animal detection and species identification service for wildlife photos."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "torch>=2.6",
    "open-clip-torch>=3.3,<4",
    "transformers>=4.51",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "rawpy==0.27.1",
    "pillow>=11.0",
    "numpy>=2.0",
    "huggingface-hub>=0.30",
    "birdnet>=1.1,<2",
]

[project.scripts]
bioscan-serve = "bioscan.service.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bioscan"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
