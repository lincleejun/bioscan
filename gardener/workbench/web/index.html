<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gardener</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main" data-action="skip">跳到主要内容</a>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 2.5 15.6 12M21.5 12h-9.6M16.7 20.2 9.8 13.2M7.3 20.2l2.5-9.3M2.5 12 9 5.2"/></svg>
        <span class="brand-name">Gardener</span>
      </div>
      <nav class="nav" aria-label="主导航">
        <a href="#/library" data-nav="library"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 8"/></svg>图库</a>
        <a href="#/fs" data-nav="fs"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13.5" width="18" height="6" rx="1.5"/><path d="M5 13.5 7.5 5h9l2.5 8.5"/><path d="M16.5 16.5h.01"/></svg>文件夹</a>
        <a href="#/species" data-nav="species"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c4 0 7-2 9-6l3-5 3 1-2 3c3 0 4 2 5 3-3 0-5 0-7 2-2 3-6 4-11 2z"/><circle cx="16" cy="7.6" r=".6" fill="currentColor"/></svg>物种</a>
        <a href="#/collections" data-nav="collections"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>集合</a>
        <div class="nav-sep" role="presentation"></div>
        <a href="#/inbox" data-nav="inbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5 6 5.5h12l2.5 8v5h-17z"/><path d="M3.5 13.5h5l1 2h5l1-2h5"/></svg>待整理<span data-bind="nav-inbox"></span></a>
        <a href="#/settings" data-nav="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>管理<span data-bind="nav-tasks"></span></a>
        <div class="nav-sep" role="presentation"></div>
        <a href="#/new" class="nav-add"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加照片</a>
      </nav>
      <div class="side-foot"><section class="disk" data-bind="disk" aria-label="本地存储"></section><section class="svc" data-bind="svc" aria-live="polite" aria-label="服务状态"></section></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Gardener 需要启用 JavaScript。</p></noscript>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
