name: models

# Real SigLIP2 + OWLv2 + BioCLIP 2.5 Huge (+ BirdNET geo, + the all-taxa list) on CPU over 95 iNaturalist photos,
# then the album profile (aesthetics, quality, scene, burst, select) on a synthetic reject set made from them,
# and the aesthetic head on the real SigLIP2 vectors (tests/models/test_aesthetic_models.py).
# Report: the job summary, the job log and the `models-report` artifact. The harness steps compare the
# run's report.json with baselines/ci-smoke.json under baselines/budget.toml, and the album report with
# baselines/ci-album.json under baselines/budget-album.toml (docs/harness.md).
# Branch pushes and PRs run when a listed path changes; a `v*` tag push always runs (GitHub does not
# evaluate path filters for tags) and publishes its report as the `bench-report-<tag>` artifact.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "bioscan/service/**"
      - "bioscan/plugins/**"
      - "bioscan/plugin.py"
      - "bioscan/profile.py"
      - "bioscan/profiles.toml"
      - "bioscan/geotag.py"
      - "bioscan/contract.py"
      - "bioscan/naming.py"
      - "bioscan/serve_config.py"
      - "bioscan/aesthetic*.py"
      - "scripts/train_aesthetic_head.py"
      - "bioscan/cull.py"
      - "scripts/cull_synth.py"
      - "data/standards.toml"
      - "tests/models/**"
      - "data/names/**"
      - "bioscan/cli/eval.py"
      - "bioscan/cli/bench.py"
      - "baselines/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/models.yml"
  pull_request:
    paths:
      - "bioscan/service/**"
      - "bioscan/plugins/**"
      - "bioscan/plugin.py"
      - "bioscan/profile.py"
      - "bioscan/profiles.toml"
      - "bioscan/geotag.py"
      - "bioscan/contract.py"
      - "bioscan/naming.py"
      - "bioscan/serve_config.py"
      - "bioscan/aesthetic*.py"
      - "scripts/train_aesthetic_head.py"
      - "bioscan/cull.py"
      - "scripts/cull_synth.py"
      - "data/standards.toml"
      - "tests/models/**"
      - "data/names/**"
      - "bioscan/cli/eval.py"
      - "bioscan/cli/bench.py"
      - "baselines/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/models.yml"
  workflow_dispatch:

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BIOSCAN_MODEL_TESTS: "1"
      BIOSCAN_REPORT: ${{ github.workspace }}/models-report.md
      BIOSCAN_PHOTO_CACHE: ${{ github.workspace }}/.photos
      BIOSCAN_REQUIRE_GEO: "1"
      BIOSCAN_REQUIRE_ALLTAXA: "1"
    steps:
      - name: Free disk (torch + ~4 GB of weights)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/models/download.py', 'bioscan/service/adapters/*.py') }}
          restore-keys: hf-
      - name: Cache BirdNET geo model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/birdnet
          key: birdnet-geo-3.0-${{ hashFiles('uv.lock') }}
      - name: All-taxa list cache key (its list sha and the BioCLIP revision it is checked against)
        id: alltaxa
        run: echo "key=$(uv run python -c 'from bioscan.service import names; from bioscan.service.adapters import bioclip; print(names.all_taxa_sha() + "-" + bioclip.REVISION[:12])')" >> "$GITHUB_OUTPUT"
      - name: Cache the all-taxa name list (built from 3.26 GB of TreeOfLife vectors on a miss)
        uses: actions/cache@v4
        with:
          path: ~/.cache/bioscan/names
          key: names-alltaxa-${{ steps.alltaxa.outputs.key }}
      - name: Download weights, BirdNET geo and the all-taxa list
        run: uv run python tests/models/download.py
      - name: Cache photos
        uses: actions/cache@v4
        with:
          path: .photos
          key: photos-${{ hashFiles('tests/models/sample.csv') }}
          restore-keys: photos-
      - name: Real-model smoke
        # tee: the album candidate report printed later can push pytest's output past what a log
        # tail shows; the last step prints the failures again
        run: |
          set -o pipefail
          HF_HUB_OFFLINE=1 uv run pytest tests/models -v -rs 2>&1 | tee pytest-models.log
      - name: Job summary
        if: always()
        # also printed to the log so the numbers are readable wherever the summary is not
        run: test -f models-report.md && tee -a "$GITHUB_STEP_SUMMARY" < models-report.md || true
      - name: Harness compare with baselines/ci-smoke.json
        if: always()
        # Markdown goes to the log and the summary (artifact download is not always possible).
        # No baseline yet: print the report between markers so it can be committed as one, and pass.
        run: |
          if [ ! -f models-report.json ]; then echo "no models-report.json (the smoke did not get far enough)"; exit 0; fi
          uv run bioscan bench analyze models-report.json --md bench-analyze.md > /dev/null
          if [ -f baselines/ci-smoke.json ]; then
            set +e
            uv run bioscan bench compare baselines/ci-smoke.json models-report.json \
              --budget baselines/budget.toml --md bench-compare.md --json bench-compare.json > /dev/null
            rc=$?
            set -e
            # compare exits 2 without writing markdown when the reports cannot be compared
            if [ -f bench-compare.md ]; then tee -a "$GITHUB_STEP_SUMMARY" < bench-compare.md; fi
          else
            rc=0
            echo "baselines/ci-smoke.json does not exist yet: candidate baseline follows" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "===== BEGIN bioscan-report ci-smoke candidate ====="
            cat models-report.json
            echo "===== END bioscan-report ci-smoke candidate ====="
          fi
          if [ -f bench-analyze.md ]; then tee -a "$GITHUB_STEP_SUMMARY" < bench-analyze.md; fi
          exit $rc
      - name: Harness compare with baselines/ci-album.json (album profile, synthetic reject set)
        if: always()
        # Same pattern as the smoke: no baseline yet prints the candidate between markers and passes.
        # The scorecard of the album tier goes to the summary; its bars do not gate (the floors in
        # tests/models do; the budget below does once the baseline exists).
        run: |
          if [ ! -f models-report-album.json ]; then echo "no models-report-album.json (the album smoke did not run)"; exit 0; fi
          uv run bioscan bench scorecard models-report-album.json --md bench-scorecard-album.md > /dev/null || true
          if [ -f bench-scorecard-album.md ]; then tee -a "$GITHUB_STEP_SUMMARY" < bench-scorecard-album.md; fi
          if [ -f baselines/ci-album.json ]; then
            set +e
            uv run bioscan bench compare baselines/ci-album.json models-report-album.json \
              --budget baselines/budget-album.toml --md bench-compare-album.md --json bench-compare-album.json > /dev/null
            rc=$?
            set -e
            if [ -f bench-compare-album.md ]; then tee -a "$GITHUB_STEP_SUMMARY" < bench-compare-album.md; fi
          else
            rc=0
            echo "baselines/ci-album.json does not exist yet: candidate baseline follows" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "===== BEGIN bioscan-report ci-album candidate ====="
            cat models-report-album.json
            echo "===== END bioscan-report ci-album candidate ====="
          fi
          exit $rc
      - name: Tag report
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          # artifact names may not contain "/" (and a few other characters): sanitise the tag
          echo "BENCH_ARTIFACT=bench-report-$(printf '%s' "$GITHUB_REF_NAME" | tr '/\:<>|*?"' '---------')" >> "$GITHUB_ENV"
          test -f models-report.json || exit 0
          echo "===== BEGIN bioscan-report ${GITHUB_REF_NAME} ====="
          cat models-report.json
          echo "===== END bioscan-report ${GITHUB_REF_NAME} ====="
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ env.BENCH_ARTIFACT }}
          path: |
            models-report.json
            models-report-album.json
            bench-compare.md
            bench-compare.json
            bench-compare-album.md
            bench-analyze.md
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: models-report
          path: |
            models-report.md
            models-report.ndjson
            models-report.json
            models-report-album.json
            bench-compare.md
            bench-compare.json
            bench-compare-album.md
            bench-compare-album.json
            bench-scorecard-album.md
            bench-analyze.md
          if-no-files-found: ignore
      - name: Real-model test failures (repeated last, so a log tail shows them)
        if: always()
        run: |
          test -f pytest-models.log || exit 0
          grep -E "^(FAILED|ERROR) |^E  |^_{5,} .* _{5,}$|^=+ .*(passed|failed|error).* =+$" pytest-models.log | tail -n 300 || true
